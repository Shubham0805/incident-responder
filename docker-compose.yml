# Containerizes the two services that never need to reach TrueForge or each
# other across a host boundary: demo-app and the sre-tools MCP server. They
# only ever talk to each other over compose's own internal network, which
# has always worked reliably.
#
#   docker compose up --build
#
# backend, the telemetry watcher, and the dashboard are NOT here -- run
# those natively (`./scripts/run_all.sh` covers all five processes at once
# if you'd rather skip Docker entirely, which is the primary, actually
# verified path -- see the README).
#
# Why the split: backend/watcher/dashboard all need to reach TrueForge
# and/or each other, which means a container reaching a process on your
# actual host. We tried this (an auto-discovered Docker-bridge-gateway IP
# paired with a host-side proxy) and it looked plausible, but Qodo's review
# caught the real flaw live: that gateway IP belongs to Docker Desktop's own
# internal Linux VM, not your Mac/Windows host directly, so it doesn't
# reliably reach a process you're running on your actual machine -- and the
# proxy that mechanism needed was bound to all network interfaces, which is
# a real exposure (an unauthenticated local TrueForge instance reachable
# from your whole network) for a benefit that didn't reliably work anyway.
# Rather than patch a fundamentally shaky mechanism further, this splits the
# architecture along the boundary that's actually solid: containers only
# talk to other containers here, everything that needs the host runs on it
# directly.
#
# First run: copy .env.example to .env if you want non-default values --
# everything has a sane default otherwise.

services:
  demo-app:
    build: ./demo-app
    ports:
      - "8081:8081"
    environment:
      DEMO_APP_PORT: "8081"

  mcp-server:
    build: ./mcp-server
    ports:
      - "8082:8082"
    environment:
      MCP_SERVER_PORT: "8082"
      DEMO_APP_URL: "http://demo-app:8081"
    depends_on:
      - demo-app
