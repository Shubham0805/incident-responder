# Brings up everything EXCEPT TrueForge itself in one command:
#   docker compose up --build
#
# TrueForge stays outside this file on purpose -- run it the way its own
# docs describe (`npx @truefoundry/trueforge@latest`, or its own Docker
# Compose) directly on your host. That keeps this repo decoupled from
# TrueForge's own release process, and keeps networking simple: every
# service below is reachable from your host via localhost on its published
# port, and the backend reaches TrueForge on your host via
# host.docker.internal.
#
# First run: copy .env.example to .env and fill in TRUEFORGE_AGENT_NAME /
# TRUEFORGE_MODEL etc. if you want non-default values -- everything has a
# sane default otherwise.

services:
  demo-app:
    build: ./demo-app
    ports:
      - "8081:8081"
    environment:
      DEMO_APP_PORT: "8081"

  mcp-server:
    build: ./mcp-server
    ports:
      - "8082:8082"
    environment:
      MCP_SERVER_PORT: "8082"
      DEMO_APP_URL: "http://demo-app:8081"
    depends_on:
      - demo-app

  backend:
    build: ./backend
    ports:
      - "8083:8083"
    environment:
      BACKEND_PORT: "8083"
      DEMO_APP_URL: "http://demo-app:8081"
      # TrueForge itself runs on your HOST (not in this compose file), so
      # the backend container reaches it via host.docker.internal -- this is
      # intentionally a DIFFERENT env var than TRUEFORGE_BASE_URL (which
      # scripts/register.py uses on the host, and should stay "localhost").
      # Reusing the same var here was a bug: setting TRUEFORGE_BASE_URL in
      # .env for register.py's sake silently broke the backend container,
      # since "localhost" inside a container means the container itself.
      # See backend/trueforge_client.py for why this is a placeholder host,
      # not a real hostname -- resolved to the Docker bridge gateway IP at
      # runtime, verified live against Docker Desktop for Mac. Pairs with
      # scripts/host_proxy.py, which must be running on your host.
      TRUEFORGE_BASE_URL: "${TRUEFORGE_DOCKER_URL:-http://__DOCKER_GATEWAY__:18790}"
      TRUEFORGE_API_KEY: "${TRUEFORGE_API_KEY:-}"
      TRUEFORGE_AGENT_NAME: "${TRUEFORGE_AGENT_NAME:-incident-responder}"
    # No `extra_hosts: host.docker.internal:host-gateway` here on purpose.
    # Docker Desktop (Mac/Windows) already resolves host.docker.internal
    # natively (IPv4, working) -- adding that extra_hosts entry ourselves
    # was verified live to override it with an IPv6 host-gateway address
    # (fdc4:...) that the container can't route, producing
    # "ConnectError: [Errno 101] Network is unreachable" even though
    # TrueForge was up and reachable the whole time. If you're on plain
    # Docker Engine on Linux (no Docker Desktop) and host.docker.internal
    # doesn't resolve for you at all, add it back:
    #   extra_hosts:
    #     - "host.docker.internal:host-gateway"
    depends_on:
      - demo-app

  watcher:
    build: ./telemetry
    environment:
      DEMO_APP_URL: "http://demo-app:8081"
      BACKEND_URL: "http://backend:8083"
      ERROR_RATE_THRESHOLD: "${ERROR_RATE_THRESHOLD:-85}"
    depends_on:
      - demo-app
      - backend

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: "http://backend:8083"
      DEMO_APP_URL: "http://demo-app:8081"
      # These two are only used for on-screen labels/links a human clicks
      # from their OWN browser on the host, so -- unlike the backend above
      # -- they stay as host-facing localhost URLs, not host.docker.internal.
      TRUEFORGE_BASE_URL: "http://localhost:8790"
      MCP_SERVER_URL: "http://localhost:8082/mcp"
    depends_on:
      - demo-app
      - backend
